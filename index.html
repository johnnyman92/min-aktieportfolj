<!DOCTYPE html>
<html>

<head>

<title>Min Aktieportfölj</title>
<style>

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
}

.logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 15px;
}

.header {
    text-align: center;
    padding: 30px;
}


.header h1 {
    font-size: 45px;
}


.container {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}



.card {

    background: #151515;
    border: 1px solid #333;
    width: 280px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;

    box-shadow: 0 0 20px rgba(0,0,0,0.5);

}



.card h2 {

    font-size: 28px;

}
.logo {

    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 15px;

}


.symbol {

    color: #aaa;
    font-size: 18px;

}



.price {

    font-size: 32px;
    margin: 20px;

}



.green {

    color: #00ff88;
    font-size: 25px;
    font-weight: bold;

}



.red {

    color: #ff4444;
    font-size: 25px;
    font-weight: bold;

}



.footer {

    text-align:center;
    margin-top:40px;
    color:#777;

}


</style>


</head>


<body>


<div class="header">

<h1>📈 Min Aktieportfölj</h1>

<p>Min digitala företags- och aktieskärm</p>

</div>



<div class="container">



<div class="card">

<img class="logo" src="images/volvo.png">
<h2>Volvo AB</h2>

<div class="symbol">
VOLV-B.ST
</div>

<div class="price">
285 kr
</div>

<div class="green">
▲ +1,8%
</div>

</div>




<div class="card">

<img class="logo" src="images/investor.png">
<h2>Investor AB</h2>

<div class="symbol">
INVE-B.ST
</div>

<div class="price">
320 kr
</div>

<div class="red">
▼ -0,5%
</div>

</div>





<div class="card">

<img class="logo" src="images/novo.png">
<h2>Novo Nordisk</h2>

<div class="symbol">
NOVO-B.CO
</div>

<div class="price">
430 DKK
</div>

<div class="green">
▲ +2,1%
</div>

</div>



</div>



<div class="footer">

Senast uppdaterad: 2026

</div>



</body>

</html>
